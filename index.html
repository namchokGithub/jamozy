<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jamozy</title>
    <!--
      Starts the Home course download while the app bundle loads (DEC-043).
      StaticHomeContentRepository takes this promise once, so the file is
      requested a single time; a missing file resolves to null.
    -->
    <!--
      Paints the theme saved on this device before the app loads, so a dark
      theme does not flash light. The key matches THEME_STORAGE_KEY in
      src/features/settings/apply-theme.ts.
    -->
    <script>
      try {
        if (localStorage.getItem('jamozy-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark'
      } catch {
        // Storage unavailable: start in the light theme.
      }
    </script>
    <script>
      window.__jamozyHomeContent = fetch('%BASE_URL%content/home.json')
        .then((response) => (response.ok ? response.json() : null))
        .catch(() => null)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
